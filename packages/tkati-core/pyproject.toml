[project]
name = "tkati-core"
version = "0.6.0"
description = "Core abstractions for Kafka/ClickHouse streaming pipeline nodes"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "Apache-2.0" }
keywords = ["kafka", "clickhouse", "streaming", "pyarrow", "data-pipeline"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Distributed Computing",
]
dependencies = [
    "clickhouse-connect>=0.11.0",
    "confluent-kafka>=2.11.0",
    "loguru>=0.7.3",
    "orjson>=3.9.0",
    "prometheus-client>=0.21",
    "pyarrow>=21.0.0",
    "pydantic-settings>=2.11.0",
    "tenacity>=9.0.0",
]

[project.urls]
Repository = "https://github.com/epoch8/tkati"

[dependency-groups]
dev = ["pytest>=9.0.1"]

[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[tool.maturin]
# The Rust crate in src/ builds tkati_core._native; the pure-Python package
# sits next to Cargo.toml in tkati_core/.
module-name = "tkati_core._native"
features = ["pyo3/extension-module"]
exclude = ["benchmarks/**"]

[tool.uv]
# Rebuild the extension on `uv sync` whenever the Rust side changes, not only
# when pyproject.toml does.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "Cargo.lock" },
    { file = "src/**/*.rs" },
]

[tool.uv-workspace-codegen]
generate = true
template_type = ["test", "publish"]
