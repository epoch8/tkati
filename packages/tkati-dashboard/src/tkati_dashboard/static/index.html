<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>tkati-dashboard</title>
    <link rel="stylesheet" href="https://esm.sh/reactflow@11/dist/style.css" />
    <style>
      html, body, #root { height: 100%; margin: 0; }
      body { font-family: system-ui, sans-serif; }
      #error {
        position: absolute; top: 1rem; left: 1rem; right: 1rem;
        padding: 0.75rem 1rem; background: #fee2e2; color: #7f1d1d;
        border: 1px solid #fca5a5; border-radius: 6px; font-family: monospace;
        white-space: pre-wrap; display: none; z-index: 10;
      }
      table { border-collapse: collapse; width: 100%; font-size: 12px; }
      td, th {
        text-align: left; padding: 3px 6px; border-bottom: 1px solid #e5e7eb;
        vertical-align: top; word-break: break-word;
      }
      th { color: #6b7280; font-weight: 600; position: sticky; top: 0; background: #fff; }
      .resize-handle:hover { background: #93c5fd; }
    </style>
  </head>
  <body>
    <div id="error"></div>
    <div id="root"></div>
    <script type="module">
      import React from "https://esm.sh/react@18";
      import { createRoot } from "https://esm.sh/react-dom@18/client";
      import ReactFlow, {
        Background,
        Controls,
        MiniMap,
        Position,
      } from "https://esm.sh/reactflow@11?deps=react@18,react-dom@18";

      const h = React.createElement;

      const GROUP_COLORS = {
        "source-sink": { background: "#dbeafe", border: "#3b82f6" },
        "processing-node": { background: "#dcfce7", border: "#22c55e" },
      };

      // Type-specific connection details worth surfacing on the node itself.
      function nodeLabel(n) {
        const lines = [n.label, `(${n.type})`];
        if (n.type === "kafka-topic" && n.connection) {
          if (n.connection.broker) lines.push(`broker: ${n.connection.broker}`);
          if (n.connection.topic) lines.push(`topic: ${n.connection.topic}`);
        }
        return lines.join("\n");
      }

      // Identifies an edge's consumer for looking up its fetched lag, independent of array index.
      function edgeKey(e) {
        return `${e.from}->${e.to}->${e.consumer?.group_id ?? ""}`;
      }

      function edgeLabel(e, lagState) {
        const groupId = e.consumer?.group_id;
        if (!groupId) return e.kind;
        let lagText = "";
        if (lagState?.status === "ready") lagText = ` · lag: ${lagState.total_lag}`;
        else if (lagState?.status === "error") lagText = " · lag: n/a";
        return `${e.kind} · group: ${groupId}${lagText}`;
      }

      // Assigns each node a y = topological rank (BFS distance from a root), x = index
      // within that rank, so the graph reads top-to-bottom as a pipeline.
      function layout(nodes, edges) {
        const outgoing = new Map(nodes.map((n) => [n.id, []]));
        const incomingCount = new Map(nodes.map((n) => [n.id, 0]));
        for (const e of edges) {
          outgoing.get(e.from)?.push(e.to);
          incomingCount.set(e.to, (incomingCount.get(e.to) ?? 0) + 1);
        }

        const rank = new Map();
        let frontier = nodes.filter((n) => incomingCount.get(n.id) === 0).map((n) => n.id);
        if (frontier.length === 0 && nodes.length > 0) frontier = [nodes[0].id];
        for (const id of frontier) rank.set(id, 0);

        while (frontier.length > 0) {
          const next = [];
          for (const id of frontier) {
            for (const target of outgoing.get(id) ?? []) {
              const candidate = rank.get(id) + 1;
              if (!rank.has(target) || candidate > rank.get(target)) {
                rank.set(target, candidate);
                next.push(target);
              }
            }
          }
          frontier = next;
        }
        for (const n of nodes) if (!rank.has(n.id)) rank.set(n.id, 0);

        const rowCounts = new Map();
        const positioned = nodes.map((n) => {
          const r = rank.get(n.id);
          const x = rowCounts.get(r) ?? 0;
          rowCounts.set(r, x + 1);
          const colors = GROUP_COLORS[n.group] ?? { background: "#e5e7eb", border: "#6b7280" };
          return {
            id: n.id,
            position: { x: x * 240, y: r * 160 },
            sourcePosition: Position.Bottom,
            targetPosition: Position.Top,
            data: { label: nodeLabel(n) },
            style: {
              background: colors.background,
              border: `1px solid ${colors.border}`,
              borderRadius: 8,
              padding: 8,
              minWidth: 170,
              whiteSpace: "pre-line",
              fontSize: 12,
              cursor: "pointer",
            },
          };
        });
        return positioned;
      }

      // Collapsible panel section. `children` stays mounted (just hidden) while collapsed, so a
      // live-fetching section like EventSnapshot/TopicStats doesn't re-fetch every time it's
      // toggled back open.
      function Section({ title, children, defaultOpen = true }) {
        const [open, setOpen] = React.useState(defaultOpen);
        return h(
          "div",
          { style: { marginBottom: 16 } },
          h(
            "div",
            {
              onClick: () => setOpen((o) => !o),
              style: {
                display: "flex",
                alignItems: "center",
                gap: 4,
                cursor: "pointer",
                userSelect: "none",
                fontSize: 11,
                fontWeight: 700,
                color: "#6b7280",
                textTransform: "uppercase",
                marginBottom: 6,
                letterSpacing: 0.4,
              },
            },
            h(
              "span",
              {
                style: {
                  display: "inline-block",
                  fontSize: 9,
                  transform: open ? "rotate(90deg)" : "none",
                  transition: "transform 0.1s",
                },
              },
              "▶",
            ),
            title,
          ),
          h("div", { style: { display: open ? "block" : "none" } }, children),
        );
      }

      function formatCell(v) {
        if (v === undefined || v === null) return "";
        if (typeof v === "object") return JSON.stringify(v);
        return String(v);
      }

      function formatDuration(msString) {
        const ms = Number(msString);
        if (ms < 0) return "unbounded";
        const units = [
          ["d", 86400000],
          ["h", 3600000],
          ["m", 60000],
          ["s", 1000],
        ];
        for (const [suffix, unitMs] of units) {
          if (ms >= unitMs) return `${(ms / unitMs).toFixed(1)}${suffix}`;
        }
        return `${ms}ms`;
      }

      function formatBytes(byteString) {
        const bytes = Number(byteString);
        if (bytes < 0) return "unbounded";
        const units = ["B", "KiB", "MiB", "GiB", "TiB"];
        let value = bytes;
        let i = 0;
        while (value >= 1024 && i < units.length - 1) {
          value /= 1024;
          i++;
        }
        return `${value.toFixed(i > 0 ? 1 : 0)} ${units[i]}`;
      }

      const BYTE_CONFIGS = new Set(["retention.bytes", "segment.bytes", "max.message.bytes"]);

      function formatConfigValue(name, value) {
        if (name === "retention.ms") return formatDuration(value);
        if (BYTE_CONFIGS.has(name)) return formatBytes(value);
        return value;
      }

      function KVTable({ rows }) {
        return h(
          "table",
          null,
          h(
            "tbody",
            null,
            rows.map(([k, v]) =>
              h(
                "tr",
                { key: k },
                h("td", { style: { color: "#6b7280", width: "40%" } }, k),
                h("td", null, formatCell(v)),
              ),
            ),
          ),
        );
      }

      // Reorders an event's keys to match the schema's field order (schema fields first, then
      // any extras), purely so related fields read together — a message can have 5-20 fields,
      // which a wide table has no good way to show in a narrow side panel.
      function orderBySchema(event, schema) {
        if (!schema) return event;
        const ordered = {};
        for (const key of Object.keys(schema)) {
          if (key in event) ordered[key] = event[key];
        }
        for (const key of Object.keys(event)) {
          if (!(key in ordered)) ordered[key] = event[key];
        }
        return ordered;
      }

      // Fetches /api/nodes/{id}/snapshot for a selected kafka-topic node and renders each
      // message as its own pretty-printed JSON block — a table falls apart once a message has
      // more than a handful of fields, so this shows one whole record at a time instead.
      function formatKafkaTimestamp(ms) {
        if (ms === null || ms === undefined) return "no timestamp";
        return new Date(ms).toISOString();
      }

      const BUTTON_STYLE = {
        border: "1px solid #d1d5db",
        background: "#fff",
        borderRadius: 6,
        padding: "4px 10px",
        fontSize: 12,
        cursor: "pointer",
        color: "#374151",
      };

      // Fetches messages only on demand — a message-heavy topic isn't something to hit every
      // time its node happens to be selected — and lets the user pull a fresh batch afterward.
      function EventSnapshot({ nodeId, schema }) {
        // `events` (the last successfully loaded batch) is tracked separately from `phase`, so
        // a refresh keeps rendering the same event list underneath rather than replacing it
        // with a bare "Loading…" — swapping the whole panel content out and back in mid-fetch
        // shrinks the scrollable container and makes the browser clamp/reset its scroll
        // position, which is exactly what a refresh shouldn't do.
        const [events, setEvents] = React.useState(null);
        const [phase, setPhase] = React.useState("idle"); // "idle" | "loading" | "error"
        const [errorMessage, setErrorMessage] = React.useState(null);

        const load = React.useCallback(() => {
          setPhase("loading");
          fetch(`/api/nodes/${encodeURIComponent(nodeId)}/snapshot`)
            .then(async (res) => {
              if (!res.ok) {
                const body = await res.json().catch(() => ({}));
                throw new Error(body.detail || `HTTP ${res.status}`);
              }
              return res.json();
            })
            .then((body) => {
              setEvents(body.events);
              setPhase("idle");
            })
            .catch((e) => {
              setErrorMessage(e.message);
              setPhase("error");
            });
        }, [nodeId]);

        // A different node was selected — drop any previously loaded batch rather than show
        // stale events under a "Refresh" button that would otherwise silently apply to the
        // wrong topic.
        React.useEffect(() => {
          setEvents(null);
          setPhase("idle");
          setErrorMessage(null);
        }, [nodeId]);

        if (events === null) {
          if (phase === "idle") {
            return h("button", { onClick: load, style: BUTTON_STYLE }, "Load latest events");
          }
          if (phase === "loading") {
            return h("div", { style: { color: "#6b7280" } }, "Loading…");
          }
          return h(
            "div",
            null,
            h(
              "div",
              {
                style: {
                  color: "#b91c1c",
                  fontFamily: "monospace",
                  whiteSpace: "pre-wrap",
                  marginBottom: 8,
                },
              },
              errorMessage,
            ),
            h("button", { onClick: load, style: BUTTON_STYLE }, "Retry"),
          );
        }

        return h(
          "div",
          null,
          h(
            "div",
            { style: { display: "flex", justifyContent: "flex-end", alignItems: "center", gap: 8, marginBottom: 8 } },
            phase === "error" &&
              h("span", { style: { color: "#b91c1c", fontSize: 11 } }, `Refresh failed: ${errorMessage}`),
            h(
              "button",
              { onClick: load, disabled: phase === "loading", style: BUTTON_STYLE },
              phase === "loading" ? "Refreshing…" : "↻ Refresh",
            ),
          ),
          events.length === 0
            ? h("div", { style: { color: "#6b7280" } }, "No recent events found.")
            : h(
                "div",
                { style: { display: "flex", flexDirection: "column", gap: 8 } },
                events.map((event, i) =>
                  h(
                    "div",
                    {
                      key: i,
                      style: { border: "1px solid #e5e7eb", borderRadius: 6, overflow: "hidden" },
                    },
                    h(
                      "div",
                      {
                        style: {
                          display: "flex",
                          flexWrap: "wrap",
                          gap: 8,
                          padding: "4px 8px",
                          background: "#eef2ff",
                          color: "#4338ca",
                          fontSize: 10,
                          fontFamily: "monospace",
                        },
                      },
                      h("span", null, `partition ${event.partition}`),
                      h("span", null, `offset ${event.offset}`),
                      h("span", null, formatKafkaTimestamp(event.timestamp)),
                    ),
                    h(
                      "pre",
                      {
                        style: {
                          margin: 0,
                          padding: 8,
                          background: "#f9fafb",
                          fontSize: 11,
                          lineHeight: 1.5,
                          whiteSpace: "pre-wrap",
                          wordBreak: "break-word",
                        },
                      },
                      JSON.stringify(orderBySchema(event.value, schema), null, 2),
                    ),
                  ),
                ),
              ),
        );
      }

      // Fetches /api/nodes/{id}/topic-stats for a selected kafka-topic node: partitioning,
      // replication, and topic-level config (retention, cleanup policy, ...).
      function TopicStats({ nodeId }) {
        const [state, setState] = React.useState({ status: "loading" });

        React.useEffect(() => {
          setState({ status: "loading" });
          fetch(`/api/nodes/${encodeURIComponent(nodeId)}/topic-stats`)
            .then(async (res) => {
              if (!res.ok) {
                const body = await res.json().catch(() => ({}));
                throw new Error(body.detail || `HTTP ${res.status}`);
              }
              return res.json();
            })
            .then((body) => setState({ status: "ready", stats: body }))
            .catch((e) => setState({ status: "error", message: e.message }));
        }, [nodeId]);

        if (state.status === "loading") {
          return h("div", { style: { color: "#6b7280" } }, "Loading…");
        }
        if (state.status === "error") {
          return h(
            "div",
            { style: { color: "#b91c1c", fontFamily: "monospace", whiteSpace: "pre-wrap" } },
            state.message,
          );
        }

        const { partition_count, replication_factor, partitions, config } = state.stats;
        const underReplicated = partitions.some((p) => p.under_replicated);
        // A "*" flags a config value that differs from the broker default, i.e. was
        // deliberately set on this topic rather than inherited.
        const configRows = Object.entries(config).map(([name, entry]) => [
          entry.is_default ? name : `${name} *`,
          formatConfigValue(name, entry.value),
        ]);

        return h(
          "div",
          null,
          h(
            "div",
            { style: { fontSize: 12, marginBottom: 8 } },
            `${partition_count} partition${partition_count === 1 ? "" : "s"}, replication factor ${replication_factor}`,
          ),
          underReplicated &&
            h(
              "div",
              { style: { color: "#b91c1c", fontSize: 12, marginBottom: 8 } },
              "⚠ under-replicated partition(s)",
            ),
          h(
            "div",
            {
              style: {
                maxHeight: 160,
                overflow: "auto",
                border: "1px solid #e5e7eb",
                borderRadius: 6,
                marginBottom: 12,
              },
            },
            h(
              "table",
              null,
              h(
                "thead",
                null,
                h(
                  "tr",
                  null,
                  ["partition", "leader", "replicas", "isrs"].map((c) => h("th", { key: c }, c)),
                ),
              ),
              h(
                "tbody",
                null,
                partitions.map((p) =>
                  h(
                    "tr",
                    { key: p.partition, style: p.under_replicated ? { background: "#fef2f2" } : undefined },
                    h("td", null, p.partition),
                    h("td", null, p.leader),
                    h("td", null, p.replicas.join(", ")),
                    h("td", null, p.isrs.join(", ")),
                  ),
                ),
              ),
            ),
          ),
          configRows.length > 0 && h(KVTable, { rows: configRows }),
          configRows.some(([name]) => name.endsWith(" *")) &&
            h("div", { style: { fontSize: 11, color: "#6b7280", marginTop: 4 } }, "* differs from broker default"),
        );
      }

      function NodeDetails({ node }) {
        const connectionRows = node.connection ? Object.entries(node.connection) : [];
        const configRows = node.config ? Object.entries(node.config) : [];
        const schemaRows = node.schema ? Object.entries(node.schema) : [];

        return h(
          "div",
          null,
          h("div", { style: { fontSize: 15, fontWeight: 700, marginBottom: 4 } }, node.label),
          h("div", { style: { color: "#6b7280", fontSize: 12, marginBottom: 16 } }, node.type),
          connectionRows.length > 0 &&
            h(Section, { title: "Connection" }, h(KVTable, { rows: connectionRows })),
          configRows.length > 0 &&
            h(Section, { title: "Config" }, h(KVTable, { rows: configRows })),
          schemaRows.length > 0 &&
            h(Section, { title: "Schema" }, h(KVTable, { rows: schemaRows })),
          node.type === "kafka-topic" &&
            h(Section, { title: "Topic stats" }, h(TopicStats, { nodeId: node.id })),
          node.type === "kafka-topic" &&
            h(Section, { title: "Latest events" }, h(EventSnapshot, { nodeId: node.id, schema: node.schema })),
        );
      }

      // Persists a resizable panel width across reloads, tracking a drag on a handle rendered
      // separately (see the returned `resizing` flag / `startResizing` callback).
      function useResizablePanelWidth(storageKey, defaultWidth, min, max) {
        const [width, setWidth] = React.useState(() => {
          try {
            const stored = Number(localStorage.getItem(storageKey));
            if (Number.isFinite(stored) && stored >= min && stored <= max) return stored;
          } catch {
            // localStorage unavailable (private mode, etc.) — fall back to the default.
          }
          return defaultWidth;
        });
        const [resizing, setResizing] = React.useState(false);

        React.useEffect(() => {
          if (!resizing) return;
          const previousCursor = document.body.style.cursor;
          const previousUserSelect = document.body.style.userSelect;
          document.body.style.cursor = "col-resize";
          document.body.style.userSelect = "none";

          // The panel is flush against the right edge of the window, so its target width is
          // just the distance from the cursor to that edge.
          const onMove = (e) => setWidth(Math.min(max, Math.max(min, window.innerWidth - e.clientX)));
          const onUp = () => setResizing(false);
          document.addEventListener("mousemove", onMove);
          document.addEventListener("mouseup", onUp);
          return () => {
            document.removeEventListener("mousemove", onMove);
            document.removeEventListener("mouseup", onUp);
            document.body.style.cursor = previousCursor;
            document.body.style.userSelect = previousUserSelect;
          };
        }, [resizing, min, max]);

        React.useEffect(() => {
          try {
            localStorage.setItem(storageKey, String(width));
          } catch {
            // Nothing to persist to — the width just resets to the default next load.
          }
        }, [width, storageKey]);

        return [width, () => setResizing(true), resizing];
      }

      // Always visible, like an inspector rather than a popup: shows a placeholder until a
      // node is selected, and its own drag handle lets it be resized to fit wide messages.
      function InspectorPanel({ node, width, onStartResize, resizing }) {
        return h(
          "div",
          {
            style: {
              width,
              flexShrink: 0,
              display: "flex",
              background: "#fff",
              borderLeft: "1px solid #e5e7eb",
              boxShadow: "-2px 0 8px rgba(0,0,0,0.04)",
            },
          },
          h("div", {
            className: "resize-handle",
            onMouseDown: onStartResize,
            style: {
              width: 6,
              flexShrink: 0,
              cursor: "col-resize",
              background: resizing ? "#3b82f6" : "transparent",
            },
          }),
          h(
            "div",
            { style: { flex: 1, minWidth: 0, padding: 16, overflowY: "auto" } },
            node
              ? h(NodeDetails, { node })
              : h(
                  "div",
                  { style: { color: "#6b7280", fontSize: 13, marginTop: 24, textAlign: "center" } },
                  "Select a node to inspect it",
                ),
          ),
        );
      }

      function App() {
        const [graph, setGraph] = React.useState(null);
        const [error, setError] = React.useState(null);
        const [selectedNodeId, setSelectedNodeId] = React.useState(null);
        const [lagByEdge, setLagByEdge] = React.useState({});
        const [panelWidth, startResize, resizing] = useResizablePanelWidth(
          "tkati-dashboard-panel-width",
          360,
          260,
          800,
        );

        React.useEffect(() => {
          fetch("/api/graph")
            .then(async (res) => {
              if (!res.ok) {
                const body = await res.json().catch(() => ({}));
                throw new Error(body.detail || `HTTP ${res.status}`);
              }
              return res.json();
            })
            .then(setGraph)
            .catch((e) => setError(e.message));
        }, []);

        // Once the graph is in, fetch live consumer lag for every stream edge whose source is
        // a kafka-topic and which names a consumer group — best-effort, per edge, independent
        // of the rest of the page.
        React.useEffect(() => {
          if (!graph) return;
          const nodesById = new Map(graph.nodes.map((n) => [n.id, n]));
          for (const e of graph.edges) {
            const groupId = e.consumer?.group_id;
            if (!groupId || nodesById.get(e.from)?.type !== "kafka-topic") continue;
            const key = edgeKey(e);
            setLagByEdge((prev) => ({ ...prev, [key]: { status: "loading" } }));
            fetch(
              `/api/nodes/${encodeURIComponent(e.from)}/consumer-lag?group_id=${encodeURIComponent(groupId)}`,
            )
              .then(async (res) => {
                if (!res.ok) {
                  const body = await res.json().catch(() => ({}));
                  throw new Error(body.detail || `HTTP ${res.status}`);
                }
                return res.json();
              })
              .then((body) =>
                setLagByEdge((prev) => ({
                  ...prev,
                  [key]: { status: "ready", total_lag: body.total_lag },
                })),
              )
              .catch((err) =>
                setLagByEdge((prev) => ({
                  ...prev,
                  [key]: { status: "error", message: err.message },
                })),
              );
          }
        }, [graph]);

        if (error) {
          const el = document.getElementById("error");
          el.textContent = "Failed to load dataflow: " + error;
          el.style.display = "block";
          return null;
        }
        if (!graph) return null;

        const nodes = layout(graph.nodes, graph.edges);
        const edges = graph.edges.map((e, i) => ({
          id: `${e.from}-${e.to}-${i}`,
          source: e.from,
          target: e.to,
          label: edgeLabel(e, lagByEdge[edgeKey(e)]),
          animated: e.kind === "stream",
          markerEnd: { type: "arrowclosed" },
        }));

        const selectedNode = graph.nodes.find((n) => n.id === selectedNodeId) ?? null;

        return h(
          "div",
          { style: { display: "flex", height: "100%" } },
          h(
            "div",
            { style: { flex: 1, minWidth: 0 } },
            h(
              ReactFlow,
              {
                nodes,
                edges,
                fitView: true,
                onNodeClick: (_event, node) => setSelectedNodeId(node.id),
                onPaneClick: () => setSelectedNodeId(null),
              },
              h(Background, null),
              h(Controls, null),
              h(MiniMap, null),
            ),
          ),
          h(InspectorPanel, {
            node: selectedNode,
            width: panelWidth,
            onStartResize: startResize,
            resizing,
          }),
        );
      }

      createRoot(document.getElementById("root")).render(h(App));
    </script>
  </body>
</html>
