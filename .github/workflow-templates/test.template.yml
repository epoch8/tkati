{#- Packages with a Rust extension built by maturin; see publish.template.yml. #}
{%- set maturin = package.name in ["tkati-core"] -%}
name: Test {{ package.name }}

on:
  push:
    paths:
      - ".github/workflows/test-{{ package.name }}.yml"
      - "{{ package.path }}/**"
      {%- for dependency in package.workspace_dependencies %}
      - "{{ dependency.path }}/**"
      {%- endfor %}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7
      {%- if maturin %}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "{{ package.path }} -> target"
      {%- endif %}

      - name: Build wheel
        run: uv build
        working-directory: {{ package.path }}

  test:
    runs-on: ubuntu-latest

    services:
      redpanda:
        image: redpandadata/redpanda:v25.2.1
        ports:
          - 9092:9092
          - 9644:9644
        options: >-
          --health-cmd "curl -f http://localhost:9644/v1/status/ready"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      clickhouse:
        image: clickhouse/clickhouse-server:latest
        ports:
          - 8123:8123
          - 9000:9000
        env:
          CLICKHOUSE_DB: default
          CLICKHOUSE_USER: default
          CLICKHOUSE_PASSWORD: default
        options: >-
          --health-cmd "wget --no-verbose --tries=1 -O - http://localhost:8123/ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@v6
      {%- if maturin %}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "{{ package.path }} -> target"
      {%- endif %}
      {%- for dependency in package.workspace_dependencies %}
      {%- if dependency.name in ["tkati-core"] %}

      # {{ dependency.name }} is a Rust extension, compiled by `uv sync` below.
      - name: Cache {{ dependency.name }}'s Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "{{ dependency.path }} -> target"
      {%- endif %}
      {%- endfor %}

      - name: Install deps
        run: uv sync --package {{ package.name }}
      {%- if maturin %}

      # After `uv sync` and through `uv run`: pyo3's build script needs a
      # Python matching the crate's abi3 floor, and would otherwise pick up the
      # runner's older system python3. `uv run` points it at the synced venv
      # via VIRTUAL_ENV.
      - name: Check Rust formatting
        run: uv run --no-sync cargo fmt --check
        working-directory: {{ package.path }}

      - name: Lint Rust
        run: uv run --no-sync cargo clippy --all-targets -- -D warnings
        working-directory: {{ package.path }}

      - name: Run Rust tests
        run: uv run --no-sync cargo test
        working-directory: {{ package.path }}
      {%- endif %}

      - name: Check formatting
        run: uvx ruff check {{ package.path }}

      - name: Check typing
        shell: bash
        run: |
          uv run ty check {{ package.path }}

      - name: Run tests
        run: uv run pytest {{ package.path }}
