      # runner's older system python3. `uv run` points it at the synced venv
      # via VIRTUAL_ENV.
      - name: Check Rust formatting
        run: uv run --no-sync cargo fmt --check
        working-directory: packages/tkati-core

      - name: Lint Rust
        run: uv run --no-sync cargo clippy --all-targets -- -D warnings
        working-directory: packages/tkati-core

      - name: Run Rust tests
        run: uv run --no-sync cargo test
        working-directory: packages/tkati-core

      - name: Check formatting
        run: uvx ruff check packages/tkati-core

      - name: Check typing
        shell: bash
        run: |
          uv run ty check packages/tkati-core

      - name: Run tests
        run: uv run pytest packages/tkati-core